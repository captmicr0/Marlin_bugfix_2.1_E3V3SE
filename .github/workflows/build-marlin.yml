name: Build E3V3SE Firmware

# Run this workflow from the branch you want to build (c13_sd or c13_octoprint):
# the committed configuration of that branch is the starting point, and the inputs below
# only override individual feature defines for this build.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "PlatformIO environment to compile"
        required: true
        type: choice
        default: "STM32F103RET6_creality"
        options:
          - STM32F103RET6_creality

      dwin_render_thumbnail:
        description: "DWIN_RENDER_THUMBNAIL (render G-code thumbnail on the LCD)"
        type: boolean
        default: true
      one_click_print:
        description: "ONE_CLICK_PRINT (SD card only; keep off for OctoPrint)"
        type: boolean
        default: true
      d_routine_auto_offset:
        description: "D_ROUTINE_AUTO_OFFSET (Z offset, Delta pattern)"
        type: boolean
        default: true
      x_routine_auto_offset:
        description: "X_ROUTINE_AUTO_OFFSET (Z offset, X pattern)"
        type: boolean
        default: false
      ft_motion:
        description: "FT_MOTION (fixed-time motion and shapers)"
        type: boolean
        default: true
      lin_advance:
        description: "LIN_ADVANCE (Linear Advance)"
        type: boolean
        default: false
      dwin_input_shaping_menu:
        description: "DWIN_INPUT_SHAPING_MENU (requires FT_MOTION)"
        type: boolean
        default: false
      dwin_dimm_menu:
        description: "DWIN_DIMM_MENU (brightness/dimmer menu)"
        type: boolean
        default: true
      dwin_zhome_menu:
        description: "DWIN_ZHOME_MENU (Z height after homing menu)"
        type: boolean
        default: true
      extra_preheat_labels:
        description: "EXTRA_PREHEAT_LABELS (two extra preheat materials)"
        type: boolean
        default: true
      dwin_custom_extrude:
        description: "DWIN_CUSTOM_EXTRUDE (custom extrude menu)"
        type: boolean
        default: true
      skew_correction:
        description: "SKEW_CORRECTION"
        type: boolean
        default: false
      dwin_skew_menu:
        description: "DWIN_SKEW_MENU (requires SKEW_CORRECTION)"
        type: boolean
        default: false
      octoprint_plugin:
        description: "OCTOPRINT_PLUGIN (c13_octoprint branch only)"
        type: boolean
        default: false
      meatpack:
        description: "MEATPACK_ON_SERIAL_PORT_1 (host transmission compression)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Apply firmware options
        run: |
          python .github/scripts/apply_marlin_options.py \
            DWIN_RENDER_THUMBNAIL=${{ inputs.dwin_render_thumbnail }} \
            ONE_CLICK_PRINT=${{ inputs.one_click_print }} \
            D_ROUTINE_AUTO_OFFSET=${{ inputs.d_routine_auto_offset }} \
            X_ROUTINE_AUTO_OFFSET=${{ inputs.x_routine_auto_offset }} \
            FT_MOTION=${{ inputs.ft_motion }} \
            LIN_ADVANCE=${{ inputs.lin_advance }} \
            DWIN_INPUT_SHAPING_MENU=${{ inputs.dwin_input_shaping_menu }} \
            DWIN_DIMM_MENU=${{ inputs.dwin_dimm_menu }} \
            DWIN_ZHOME_MENU=${{ inputs.dwin_zhome_menu }} \
            EXTRA_PREHEAT_LABELS=${{ inputs.extra_preheat_labels }} \
            DWIN_CUSTOM_EXTRUDE=${{ inputs.dwin_custom_extrude }} \
            SKEW_CORRECTION=${{ inputs.skew_correction }} \
            DWIN_SKEW_MENU=${{ inputs.dwin_skew_menu }} \
            OCTOPRINT_PLUGIN=${{ inputs.octoprint_plugin }} \
            MEATPACK_ON_SERIAL_PORT_1=${{ inputs.meatpack }}

      - name: Compile firmware
        run: pio run -e "${{ inputs.env }}" 2>&1 | tee build.log

      - name: Report memory usage
        run: |
          {
            echo "### Firmware size (${{ github.ref_name }}, ${{ inputs.env }})"
            echo '```'
            grep -E "^(RAM|Flash):" build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ inputs.env }}
          path: .pio/build/${{ inputs.env }}/firmware*.bin
          retention-days: 7
          if-no-files-found: error
